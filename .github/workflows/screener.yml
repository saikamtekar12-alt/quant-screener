name: Run Quant Screener

on:
  schedule:
    # Runs every 30 minutes from 03:30 to 10:00 UTC (9:00 AM to 3:30 PM IST) on weekdays
    - cron: '*/30 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install yfinance numpy

      - name: Compute Screening Models
        run: python scanner.py

      - name: Deploy Fresh Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add screener.json
          git commit -m "sync screener telemetry [skip ci]" || exit 0
          git push
