<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quant Screener - Derivatives Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #030a1a; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .table-header { background-color: #0b1a38; border-bottom: 2px solid #1a2e5a; }
  </style>
</head>
<body class="text-slate-100 min-h-screen p-2 md:p-6">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Top Ticker Bar -->
    <div class="flex items-center justify-between border-b border-blue-900/60 pb-3">
      <div class="flex items-center space-x-3">
        <span class="text-blue-300 font-bold text-sm tracking-wider" id="index-name">NIFTY FIN SERVICE</span>
        <span class="text-white font-bold text-sm" id="index-ltp">25,394.50</span>
        <span class="text-emerald-400 font-bold text-xs" id="index-chg">▲ 132.10</span>
      </div>
      <span class="text-[10px] text-slate-400" id="sync-time">Syncing...</span>
    </div>

    <!-- Section 1: Bullish Short Covering / Breakout Engine -->
    <div class="space-y-2">
      <h2 class="text-xs font-bold text-cyan-400 uppercase tracking-widest px-1">Active Pullback & Short Covering Tape</h2>
      <div class="overflow-x-auto rounded border border-blue-900/50 bg-[#06122c]">
        <table class="w-full text-left text-xs whitespace-nowrap">
          <thead class="table-header text-slate-400 uppercase text-[10px]">
            <tr>
              <th class="py-2.5 px-3">SYMBOL</th>
              <th class="py-2.5 px-3 text-right">LTP (₹)</th>
              <th class="py-2.5 px-3 text-right">RVAT</th>
              <th class="py-2.5 px-3 text-right">VWAP GAP %</th>
              <th class="py-2.5 px-3 text-right">FUTURES OI %</th>
              <th class="py-2.5 px-3 text-left pl-6">OI BEHAVIOUR</th>
            </tr>
          </thead>
          <tbody id="short-covering-rows" class="divide-y divide-blue-950/60">
            <tr><td colspan="6" class="p-4 text-center text-slate-500">Scanning tape...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Section 2: Long Unwinding Tape -->
    <div class="space-y-2">
      <h2 class="text-xs font-bold text-rose-400 uppercase tracking-widest px-1">Weakness & Long Unwinding Tape</h2>
      <div class="overflow-x-auto rounded border border-blue-900/50 bg-[#06122c]">
        <table class="w-full text-left text-xs whitespace-nowrap">
          <thead class="table-header text-slate-400 uppercase text-[10px]">
            <tr>
              <th class="py-2.5 px-3">SYMBOL</th>
              <th class="py-2.5 px-3 text-right">LTP (₹)</th>
              <th class="py-2.5 px-3 text-right">RVAT</th>
              <th class="py-2.5 px-3 text-right">VWAP GAP %</th>
              <th class="py-2.5 px-3 text-right">FUTURES OI %</th>
              <th class="py-2.5 px-3 text-left pl-6">OI BEHAVIOUR</th>
            </tr>
          </thead>
          <tbody id="unwinding-rows" class="divide-y divide-blue-950/60">
            <tr><td colspan="6" class="p-4 text-center text-slate-500">Scanning tape...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    async function loadScreen() {
      try {
        const res = await fetch('screener.json?nocache=' + Date.now());
        const data = await res.json();

        document.getElementById('sync-time').textContent = data.last_updated;
        document.getElementById('index-name').textContent = data.index_name;
        document.getElementById('index-ltp').textContent = data.index_ltp.toLocaleString();
        document.getElementById('index-chg').textContent = (data.index_chg >= 0 ? '▲ +' : '▼ ') + data.index_chg;
        document.getElementById('index-chg').className = data.index_chg >= 0 ? 'text-emerald-400 font-bold text-xs' : 'text-rose-400 font-bold text-xs';

        const renderRow = (s) => `
          <tr class="hover:bg-blue-900/30 transition-colors">
            <td class="py-2.5 px-3 font-semibold text-white">${s.symbol}</td>
            <td class="py-2.5 px-3 text-right text-slate-300 font-medium">₹${s.ltp.toFixed(2)}</td>
            <td class="py-2.5 px-3 text-right text-blue-300 font-medium">${s.rvat.toFixed(2)}</td>
            <td class="py-2.5 px-3 text-right font-medium ${s.vwap_gap >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
              ${s.vwap_gap >= 0 ? '+' : ''}${s.vwap_gap}%
            </td>
            <td class="py-2.5 px-3 text-right font-medium ${s.futures_oi >= 0 ? 'text-emerald-400' : 'text-rose-400'}">
              ${s.futures_oi >= 0 ? '+' : ''}${s.futures_oi}%
            </td>
            <td class="py-2.5 px-3 text-left pl-6 font-semibold text-blue-200">${s.oi_behavior}</td>
          </tr>
        `;

        const shortCovering = data.stocks.filter(s => s.oi_behavior === 'Short covering' || s.oi_behavior === 'Long buildup');
        const longUnwinding = data.stocks.filter(s => s.oi_behavior === 'Long unwinding' || s.oi_behavior === 'Short buildup');

        document.getElementById('short-covering-rows').innerHTML = shortCovering.length ? shortCovering.map(renderRow).join('') : '<tr><td colspan="6" class="p-3 text-slate-500 text-center">No short covering detected</td></tr>';
        document.getElementById('unwinding-rows').innerHTML = longUnwinding.length ? longUnwinding.map(renderRow).join('') : '<tr><td colspan="6" class="p-3 text-slate-500 text-center">No unwinding detected</td></tr>';
      } catch (err) {
        console.error(err);
      }
    }
    loadScreen();
  </script>
</body>
</html>
